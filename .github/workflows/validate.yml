name: Validate human-ai-collab

on:
  push:
    branches: [main, 'v0.3-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package structure only
        run: python tests/validate_skill.py
      - name: Executable utility tests, not LLM behavior
        run: python tests/validate_behavior_contract.py
      - name: Authored hypothetical fixtures and mutation
        run: python tests/validate_hypothetical.py
